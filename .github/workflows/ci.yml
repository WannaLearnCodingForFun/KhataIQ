name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khataiq
          POSTGRES_PASSWORD: khataiq
          POSTGRES_DB: khataiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khataiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KHATAIQ_TEST_DATABASE_URL: postgresql+psycopg://khataiq:khataiq@localhost:5432/khataiq_test
      KHATAIQ_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy khataiq
      - run: pytest -q
