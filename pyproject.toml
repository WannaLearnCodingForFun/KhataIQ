[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "khataiq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pdfplumber>=0.11",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.0",
    "email-validator>=2.1",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "anthropic>=2.4",
]

[project.optional-dependencies]
# Offline experiments (experiments/): never imported by the app.
experiments = ["lightgbm>=4.3", "mlflow>=2.14", "shap>=0.45", "matplotlib>=3.8", "pandas>=2.2"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27",
       "reportlab>=4.2", "moto[s3]>=5.0"]

[tool.setuptools.packages.find]
include = ["khataiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Postgres (KHATAIQ_TEST_DATABASE_URL); skipped when unset"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Pin the rule set so a ruff upgrade can't silently change what CI enforces.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie", "fastapi.File",
    "fastapi.Form", "fastapi.Path", "fastapi.Body", "fastapi.Security",
]

[tool.ruff.lint.isort]
# The repo's alembic/ folder holds migrations; the `alembic` package is the library.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*", "celery.*", "kombu.*", "sklearn.*", "joblib.*",
          "lightgbm.*", "mlflow.*", "shap.*", "matplotlib.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's @app.task decorator is untyped.
module = ["khataiq.pipeline.celery_app"]
disallow_untyped_decorators = false
