# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: khataiq
      POSTGRES_PASSWORD: khataiq
      POSTGRES_DB: khataiq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khataiq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: khataiq
      MINIO_ROOT_PASSWORD: khataiq-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
