# Production-style stack on one host. Secrets come from .env.prod (never committed):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See docs/deploy.md.
x-app: &app
  build: .
  image: khataiq-app:${KHATAIQ_VERSION:-latest}
  restart: unless-stopped
  environment: &app-env
    KHATAIQ_ENVIRONMENT: prod
    KHATAIQ_DATABASE_URL: postgresql+psycopg://khataiq_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.prod}@postgres:5432/khataiq
    KHATAIQ_MIGRATION_DATABASE_URL: postgresql+psycopg://khataiq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/khataiq
    KHATAIQ_REDIS_URL: redis://redis:6379/0
    KHATAIQ_S3_ENDPOINT: http://minio:9000
    KHATAIQ_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}
    KHATAIQ_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
    KHATAIQ_S3_CREATE_BUCKET: "true"
    KHATAIQ_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
    KHATAIQ_CORS_ORIGINS: '["${PUBLIC_URL:?set PUBLIC_URL in .env.prod}"]'
    KHATAIQ_LLM_API_KEY: ${LLM_API_KEY:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: khataiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: khataiq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khataiq"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    build: ops/minio   # built from source: MinIO no longer publishes images
    image: khataiq-minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
    volumes: [miniodata:/data]

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      KHATAIQ_APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.prod}

  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["8000"]

  worker:
    <<: *app
    command: ["celery", "-A", "khataiq.pipeline.celery_app", "worker", "-Q", "pipeline",
              "--concurrency", "4", "-l", "info"]
    environment:
      <<: *app-env
      KHATAIQ_METRICS_PORT: "9100"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: ["celery", "-A", "khataiq.pipeline.celery_app", "beat", "-l", "info",
              "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      disable: true

  web:
    build:
      context: ./frontend
      args: { KHATAIQ_API_URL: "http://api:8000" }
    image: khataiq-web:${KHATAIQ_VERSION:-latest}
    restart: unless-stopped
    environment:
      KHATAIQ_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: ["./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports: ["3001:3000"]
    volumes: ["./ops/grafana:/var/lib/grafana/dashboards:ro"]

volumes:
  pgdata:
  redisdata:
  miniodata:
